<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 製材計画のマーク：立てた柱材（角材）。上の木口に年輪と芯 -->
  <rect width="64" height="64" rx="14" fill="#4A2E1A"/>
  <!-- 右の側面（影） -->
  <path d="M37 14 L45 8 L45 52 L37 58 Z" fill="#C99A5B"/>
  <path d="M41 13 C42 25 40 38 41.5 54" stroke="#A87A42" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  <!-- 正面（木目） -->
  <rect x="21" y="14" width="16" height="44" fill="#EAD4A8"/>
  <path d="M26 17 C25 29 27.5 41 26 56 M32 17 C33 30 30.5 43 32 56" stroke="#C99A5B" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- 上の木口 -->
  <path d="M21 14 L29 8 L45 8 L37 14 Z" fill="#F6E3BC"/>
  <path d="M26.5 12.5 L31 9.5 L39.5 9.5 L35 12.5 Z" fill="none" stroke="#B07A3E" stroke-width="1.3"/>
  <circle cx="33" cy="11" r="1.3" fill="#8E2F25"/>
  <!-- 輪郭 -->
  <path d="M21 14 L29 8 L45 8 L45 52 L37 58 L21 58 Z M21 14 L37 14 L45 8 M37 14 L37 58" fill="none" stroke="#1E1A16" stroke-width="2" stroke-linejoin="round"/>
</svg>
